services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: impact
      POSTGRES_USER: impact
      POSTGRES_PASSWORD: impact
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impact -d impact"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      IMPACT_DATABASE_URL: postgresql+asyncpg://impact:impact@postgres:5432/impact
      IMPACT_DEV_MODE: "true"
      IMPACT_DEBUG: "true"
      IMPACT_CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
